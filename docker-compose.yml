services:

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api-gateway/.env.production
    environment:
      NODE_ENV: production
    restart: always

  vendor-service:
    build:
      context: .
      dockerfile: apps/vendor-service/Dockerfile
    container_name: vendor-service
    ports:
      - "3001:3001"
    env_file:
      - ./apps/vendor-service/.env.production
    environment:
      NODE_ENV: production
    restart: always
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3002:3002"
    env_file:
      - ./apps/auth-service/.env.production
    environment:
      NODE_ENV: production
    restart: always


  postgres:
    image: postgres:16
    container_name: optima_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optima_app

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak-postgres:
    image: postgres:16
    container_name: keycloak_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
      POSTGRES_DB: optima_keycloak_db

    ports:
      - "5433:5432"

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    restart: unless-stopped

    command: start-dev

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: optima_keycloak_db

      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    ports:
      - "8080:8080"

    depends_on:
      - keycloak-postgres

volumes:
  postgres_data:
  keycloak_postgres_data: